name: Source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-validation.txt

      - name: Run source validation
        shell: pwsh
        run: .\invoke_source_validation.ps1 -JsonOut validation-summary.json -JUnitOut validation-junit.xml

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-reports
          path: |
            validation-summary.json
            validation-junit.xml
          if-no-files-found: warn
